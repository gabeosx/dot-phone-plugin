name: Bug report
description: Report a reproducible problem with the self-hosted preview.
body:
  - type: markdown
    attributes:
      value: |
        Start with [troubleshooting](https://github.com/gabeosx/dot-phone-plugin/blob/main/docs/SUPPORT.md).
        This is public. Do not attach credentials, phone numbers, account details, call transcripts,
        recordings, raw databases, complete environment files or worker exchange directories.
        For a security issue, use the repository's **Security → Report a vulnerability** form.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include both service and installed plugin versions if they differ.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python, Docker Compose and Codex CLI versions; base or DeepFilter image.
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Where did it happen?
      options:
        - Offline checks
        - Setup or plugin linking
        - Worker or tunnel readiness
        - Call preparation
        - Conversation or result review
        - Upgrade
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and expected result
      description: Prefer fictional details and no-call steps. Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Redacted error
      description: Paste only the relevant error with all personal values removed.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I removed credentials, private call data and account details from this report.
          required: true
