[project]
name = "dots-pipecat-spike"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pipecat-ai[cli]==1.12.0",
  "mcp==2.3.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
acoustic = [
    "av==16.1.0",
    "faster-whisper==1.2.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E501"]
