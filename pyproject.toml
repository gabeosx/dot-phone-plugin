[project]
name = "dots-phone"
version = "0.3.2"
description = "Private supervised Dots phone plugin"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "NOTICE", "vendor/voice_evals/LICENSE", "vendor/agent-plugins-LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "pyyaml==6.0.3",
  "mcp==2.3.0",
  "openai==3.26.1",
  "twilio==9.11.2",
  "twilio-agent-connect[server,gpt-live]==2.5.0",
  "fastapi==0.143.0",
  "uvicorn==0.54.0",
  "cryptography==50.0.2",
  "argon2-cffi==25.1.0",
  "httpx==0.28.1",
  "aiohttp==3.14.4",
  "authlib==1.8.0",
  "standardwebhooks==1.1.0",
]
[project.optional-dependencies]
bws = ["bitwarden-sdk==2.1.0"]
pipecat = ["pipecat-ai[websocket]==1.12.0"]
deepfilter = ["numpy==2.5.3", "soxr==1.0.0"]
audio-review = ["faster-whisper==1.2.1"]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10", "respx==0.23.1", "pip-audit==2.9.0", "audioop-lts==0.2.2; python_version >= '3.13'", "numpy==2.5.3"]
[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["dots_phone"]
[tool.hatch.build.targets.wheel.force-include]
"vendor/voice_evals" = "dots_phone/_vendor/voice_evals"
"vendor/mcp.schema.json" = "dots_phone/_vendor/mcp.schema.json"
"vendor/plugin.schema.json" = "dots_phone/_vendor/plugin.schema.json"
"evals" = "dots_phone/_evals"
"experiments/pipecat/text_eval_worker.mjs" = "dots_phone/_evals/workers/text_eval_worker.mjs"
"experiments/pipecat/codex_call_reasoner.mjs" = "dots_phone/_evals/workers/codex_call_reasoner.mjs"
"experiments/pipecat/subscription_app_server.mjs" = "dots_phone/_evals/workers/subscription_app_server.mjs"
"plugins/dots-phone" = "dots_phone/_plugin"
[tool.hatch.build.targets.sdist]
include = [
  "/dots_phone", "/plugins/dots-phone", "/tests", "/scripts", "/evals", "/vendor",
  "/experiments/pipecat", "/docs", "/.agents/plugins/marketplace.json", "/.agents/skills/dots-phone-setup", "/.github",
  "/pyproject.toml", "/uv.lock", "/README.md", "/CONTRIBUTING.md", "/LICENSE", "/NOTICE", "/MILESTONES.md", "/Dockerfile",
  "/compose*.yaml", "/.env.example", "/.dockerignore", "/.gitignore", "/.gitattributes",
]
exclude = ["**/__pycache__/**", "**/.DS_Store", "**/.secrets/**", "**/artifacts/**", "**/*.onnx", "**/*.kef", "**/DeepFilterNet*_onnx.tar.gz", "**/*.wav", "**/*.pcmu", "**/*.pcm", "**/*.whl", "**/*.so", "**/*.dylib", "**/*.pt", "**/*.safetensors"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
