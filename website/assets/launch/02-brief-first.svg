" letter-spacing="1.4" fill="#7c886f">GOAL</text><text x="674" y="340" font-size="23" font-weight="400" letter-spacing="0" fill="#33422b">Ask for the replacement</text><text x="674" y="371.05" font-size="23" font-weight="400" letter-spacing="0" fill="#33422b">washing-machine delivery window.</text><path d="M674 397 L1174 397" fill="none" stroke="#ccd6bf" stroke-width="1"/><text x="674" y="432" font-size="10" font-weight="500" letter-spacing="1.4" fill="#7c886f">DETAILS TO SHARE</text><text x="674" y="469" font-size="23" font-weight="400" letter-spacing="0" fill="#33422b">Order details supplied for this task.</text><rect x="666" y="514" width="516" height="82" rx="7" fill="#dce9ca" stroke="#c9dab2"/><text x="686" y="544" font-size="10" font-weight="500" letter-spacing="1.4" fill="#637a4a">LIMITS</text><text x="686" y="575" font-size="25" font-weight="500" letter-spacing="0" fill="#33422b">No purchases or changes.</text><path d="M62 686 L1208 686" fill="none" stroke="#2b342f" stroke-width="1"/><text x="62" y="719" font-size="11" font-weight="400" letter-spacing="1.1" fill="#a6afaa">SELF-HOSTED EXPERIMENTAL PREVIEW</text><text x="1117" y="719" font-size="11" font-weight="400" letter-spacing="1.5" fill="#79867d">02 / 05</text></svg>