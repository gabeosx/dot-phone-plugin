ated access</text><text x="66" y="630" font-size="16" font-weight="400" letter-spacing="0" fill="#a6afaa">No inbox access is required to start. Installing Dots does not grant access to your email.</text><path d="M62 686 L1208 686" fill="none" stroke="#2b342f" stroke-width="1"/><text x="62" y="719" font-size="11" font-weight="400" letter-spacing="1.1" fill="#a6afaa">SELF-HOSTED EXPERIMENTAL PREVIEW</text><text x="1117" y="719" font-size="11" font-weight="400" letter-spacing="1.5" fill="#79867d">03 / 05</text></svg>